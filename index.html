<!DOCTYPE html>
<meta charset="utf-8">
<title>旗揚げ</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #000; }
  img { max-width: 100vw; max-height: 100vh; }
</style>
<img id="i" src="hataage_left.png">
<script>
  // 平均切換え時間（秒）。URLの ?avg=2 でも上書きできる
  const AVG = Number(new URLSearchParams(location.search).get('avg')) || 5.0;
  const IMAGES = ['hataage_left.png', 'hataage_right.png'];
  IMAGES.forEach(src => { new Image().src = src; }); // 先読み

  let cur = Math.floor(Math.random() * IMAGES.length);
  i.src = IMAGES[cur];

  const next = () => {
    cur = 1 - cur;
    i.src = IMAGES[cur];
    setTimeout(next, -Math.log(1 - Math.random()) * AVG * 1000); // 指数分布（平均AVG秒）
  };
  setTimeout(next, -Math.log(1 - Math.random()) * AVG * 1000);
</script>
